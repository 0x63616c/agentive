[package]
name = "agents"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt"] }
agents-macros = { path = "../agents-macros" }
agents-test = { package = "agents-test", path = "../agents-test" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8", features = ["derive"] }

[features]
default = []
