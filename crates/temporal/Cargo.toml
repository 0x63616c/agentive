[package]
name = "agentive-temporal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
description = "Temporal durability and external payload storage for Agentive"

[dependencies]
agentive.workspace = true
base64.workspace = true
axum = { workspace = true, optional = true }
futures.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
temporalio-client.workspace = true
temporalio-common.workspace = true
temporalio-macros.workspace = true
temporalio-sdk.workspace = true
temporalio-workflow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
uuid.workspace = true
zstd.workspace = true

[features]
default = []
axum = ["dep:axum"]
tls-ring = ["temporalio-client/tls-ring"]

[dev-dependencies]
agentive-test.workspace = true
proptest.workspace = true
tempfile.workspace = true
temporalio-sdk = { workspace = true, features = ["testing"] }
temporalio-sdk-core = { workspace = true, features = ["tls-ring"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true

[lints]
workspace = true
