name: Temporal release verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      # Official Temporal action; pin the CLI rather than relying on a runner image.
      - uses: temporalio/setup-temporal@v0
        with:
          version: v1.7.2
      - run: cargo test -p agentive-temporal --test temporal_activity --all-features -- --ignored
